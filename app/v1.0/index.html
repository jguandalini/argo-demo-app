<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Recarrega a cada 5 s para mostrar a troca de versão ao vivo -->
  <meta http-equiv="refresh" content="5">
  <title>Demo App · v1.0</title>
  <style>
    :root { --cor: #2563eb; --cor-clara: #dbeafe; --fundo: #0b1530; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e3a8a 0%, var(--fundo) 60%);
      color: #fff; padding: 24px;
    }
    .card {
      width: 100%; max-width: 560px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 40px 36px;
      text-align: center; backdrop-filter: blur(6px);
    }
    .tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 2px;
           background: var(--cor-clara); color: #1e3a8a; padding: 6px 14px; border-radius: 999px; }
    .versao { font-size: 96px; font-weight: 900; line-height: 1; margin: 28px 0 8px; color: #93c5fd; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    p  { color: rgba(255,255,255,.75); font-size: 16px; line-height: 1.5; }
    .pod { margin-top: 28px; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.3);
           font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }
    .pod span { color: #93c5fd; font-weight: 700; }
    .rodape { margin-top: 22px; font-size: 13px; color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">KUBERNETES + ARGO CD</span>
    <div class="versao">v1.0</div>
    <h1>Demo App</h1>
    <p>Primeira versão da aplicação, entregue pelo Argo CD a partir do Git.</p>
    <div class="pod">pod: <span>__POD_NAME__</span></div>
    <div class="rodape">A página recarrega a cada 5 segundos · /version · /healthz</div>
  </main>
</body>
</html>

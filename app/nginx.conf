server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Troca o marcador __POD_NAME__ da página pelo hostname do container.
    # No Kubernetes, o hostname do container é o nome do pod: assim dá para
    # ver qual pod respondeu cada requisição.
    sub_filter      '__POD_NAME__' '$hostname';
    sub_filter_once off;

    # Página sempre "fresca" (útil para ver a troca de versão na demo)
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Versão da aplicação em JSON: curl http://<endereco>/version
    location = /version {
        default_type application/json;
        return 200 '{"app":"demo-app","version":"__APP_VERSION__","pod":"$hostname"}\n';
    }

    # Usado pelas probes do Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
}
